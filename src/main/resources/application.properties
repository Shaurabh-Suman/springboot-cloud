spring.application.name=spring-cloud-app
server.port=8088

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql:3306/springCloudAppDB?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC}

spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}

spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:Root@123}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect