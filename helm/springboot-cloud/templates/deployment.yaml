
apiVersion: apps/v1
kind: Deployment

metadata:
  name: {{ include "springboot-cloud.fullname" . }}
  labels:
    {{- include "springboot-cloud.labels" . | nindent 4 }}

spec:
  replicas: {{ .Values.replicaCount }}

  selector:
    matchLabels:
      {{- include "springboot-cloud.selectorLabels" . | nindent 6 }}

  template:
    metadata:
      labels:
        {{- include "springboot-cloud.selectorLabels" . | nindent 8 }}

    spec:

      containers:

        - name: springboot-cloud
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}

          ports:
            - containerPort: {{ .Values.container.port }}

          # 1. STARTUP PROBE
          # Checks whether Spring Boot has finished starting.
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.container.port }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 30

          # 2. LIVENESS PROBE
          # Checks whether the application should continue running.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: {{ .Values.container.port }}
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          # 3. READINESS PROBE
          # Checks whether the application can accept requests.
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: {{ .Values.container.port }}
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3

          env:
            - name: SPRING_PROFILES_ACTIVE
              valueFrom:
                configMapKeyRef:
                  name: springboot-config
                  key: SPRING_PROFILES_ACTIVE

            - name: SPRING_DATASOURCE_URL
              valueFrom:
                configMapKeyRef:
                  name: springboot-config
                  key: SPRING_DATASOURCE_URL

            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-username

            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: mysql-password

            - name: SPRING_DATA_REDIS_HOST
              value: {{ .Values.redis.service.name | quote }}

            - name: SPRING_DATA_REDIS_PORT
              value: {{ .Values.redis.service.port | quote }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}