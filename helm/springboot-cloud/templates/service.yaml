apiVersion: v1
kind: Service

metadata:
  name: {{ include "springboot-cloud.fullname" . }}

  labels:
    {{- include "springboot-cloud.labels" . | nindent 4 }}

spec:

  type: {{ .Values.service.type }}

  selector:

    {{- include "springboot-cloud.selectorLabels" . | nindent 4 }}

  ports:

    - port: {{ .Values.service.port }}

      targetPort: {{ .Values.service.targetPort }}

      protocol: TCP

      name: http